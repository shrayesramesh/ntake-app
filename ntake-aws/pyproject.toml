[project]
name = "ntake-aws"
version = "0.0.1"
description = "Family calendar + work items — AWS-native rebuild (API GW + Lambda + DynamoDB + Bedrock)"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (Black-compatible). Same pragmatic ruleset as the
# old app, minus the FastAPI-specific B008 carve-out (no FastAPI here).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle; I = import sort; B = bugbear; UP = pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Defaults match Black.

# ---------------------------------------------------------------------------
# mypy — type checking. Pragmatic (not --strict) so unstubbed libs (boto3) don't
# drown out real errors. (Session 3 brought the formerly-parked action modules
# back under the gate — the exclude list is gone.)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# coverage.py (via pytest-cov: `make coverage`, and the `make check` gate).
# `source = ["core"]` measures the lifted + ported core. (Session 3 brought the
# formerly-parked action modules under test — the omit list is gone.)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    # abstractmethod bodies are `...`; never executed.
    "\\.\\.\\.",
]
