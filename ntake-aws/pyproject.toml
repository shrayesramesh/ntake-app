[project]
name = "ntake-aws"
version = "0.0.1"
description = "Family calendar + work items — AWS-native rebuild (API GW + Lambda + DynamoDB + Bedrock)"
requires-python = ">=3.12"

# ===========================================================================
# PARKED MODULES (Session 2 rewires them off SQLAlchemy/app.persistence.models
# onto the DynamoDB Repository + DTOs — AWS_LLD §2). They still import the
# deleted `app.persistence.models` and `sqlalchemy`, so they are excluded from
# mypy + coverage below until Session 2 brings them back under the gate. Each
# file carries a ⚠️ PARKED banner. Keep this list in sync with those banners.
#
#   core/actions/context.py
#   core/actions/shared.py
#   core/actions/registry.py
#   core/actions/work_items.py
#   core/actions/events.py
#   core/assistant/base.py
# ===========================================================================

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (Black-compatible). Same pragmatic ruleset as the
# old app, minus the FastAPI-specific B008 carve-out (no FastAPI here).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle; I = import sort; B = bugbear; UP = pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Defaults match Black.

# ---------------------------------------------------------------------------
# mypy — type checking. Pragmatic (not --strict) so unstubbed libs (boto3) don't
# drown out real errors. The parked modules are excluded until Session 2.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Parked modules (see header) — excluded from the Session 1 gate.
exclude = '''(?x)(
    core/actions/context\.py$
  | core/actions/shared\.py$
  | core/actions/registry\.py$
  | core/actions/work_items\.py$
  | core/actions/events\.py$
  | core/assistant/base\.py$
)'''

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# coverage.py (via pytest-cov: `make coverage`, and the `make check` gate).
# `source = ["core"]` measures the lifted core; parked modules are omitted
# until Session 2 ports them (they are never imported by Session-1 tests, so
# including them would report 0% and sink the gate).
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["core"]
branch = true
omit = [
    "core/actions/context.py",
    "core/actions/shared.py",
    "core/actions/registry.py",
    "core/actions/work_items.py",
    "core/actions/events.py",
    "core/assistant/base.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    # abstractmethod bodies are `...`; never executed.
    "\\.\\.\\.",
]
